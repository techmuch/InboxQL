# Publishes site/ — the install page, the install scripts and the guides — to
# GitHub Pages.
#
# The guides in site/docs are generated here from docs/*.md and AGENTS.md by
# cmd/docsgen, with the same renderer the application's Help menu uses, so the
# site and the application cannot disagree about what a guide says.
#
# The scripts live on the Pages site rather than being fetched from the
# repository's raw files so the install command is short, stable and on a
# domain that says what it is: https://techmuch.github.io/InboxQL/install.sh
#
# Enable once: repository Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "AGENTS.md"
      - "embed.go"
      - "internal/docs/**"
      - "cmd/docsgen/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The installer is what most people run first; a syntax error in it
      # would break every install, so it is checked before it is published.
      - name: Check the install script
        run: |
          sh -n site/install.sh
          shellcheck -s sh site/install.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Every link between guides and every heading it names is checked
      # before anything is published.
      - name: Build the guides
        run: |
          go test ./internal/docs/
          go run ./cmd/docsgen -out site/docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
