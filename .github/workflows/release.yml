name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a manual run)"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.27.1"
  NODE_VERSION: "22"

jobs:
  # A tag is built only when it is the release its commit says it is: the
  # VERSION file at the tagged commit names the tag. That turns away the
  # historical tags, renamed year.month.day.n on commits from before VERSION
  # existed, and a release whose version was never bumped.
  gate:
    name: Is this a release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: check
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          file=$(cat VERSION 2>/dev/null | tr -d '[:space:]' || true)
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [ "$file" = "$tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "VERSION says $file: building it."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not building $ref: VERSION at this commit says '${file:-nothing}'. Historical tags and unbumped commits are not releases."
          fi

  frontend:
    name: Build frontend
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    name: ${{ matrix.artifact }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: iql-linux-amd64
            binary: iql
            goarch: amd64
          - os: macos-latest
            artifact: iql-darwin-universal
            binary: iql
            goarch: universal
          - os: windows-latest
            artifact: iql-windows-amd64
            binary: iql.exe
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Stage embedded assets
        shell: bash
        run: |
          rm -rf internal/embed/static
          mkdir -p internal/embed/static
          cp -r frontend/dist/* internal/embed/static/

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "value=${ref#v}" >> "$GITHUB_OUTPUT"

      # macOS gets both architectures and lipo joins them. Cross-compiling the
      # two halves works because each is a native-toolchain target on the same
      # host; going further afield would need a cross C toolchain, which is why
      # Linux and Windows build on their own runners instead.
      - name: Build (macOS universal)
        if: matrix.goarch == 'universal'
        env:
          CGO_ENABLED: "1"
        run: |
          LDFLAGS="-s -w -X github.com/user/inboxql/internal/cli.Version=${{ steps.version.outputs.value }}"
          GOARCH=amd64 go build -trimpath -tags sqlite_fts5 -ldflags "$LDFLAGS" -o iql-amd64 ./cmd/iql
          GOARCH=arm64 go build -trimpath -tags sqlite_fts5 -ldflags "$LDFLAGS" -o iql-arm64 ./cmd/iql
          lipo -create -output iql iql-amd64 iql-arm64
          lipo -info iql
          # Ad-hoc signed after joining. Apple Silicon refuses to run a binary
          # without a valid signature, and the linker's per-slice signatures
          # are not guaranteed to survive lipo. Ad hoc needs no Developer ID;
          # it is not notarisation, and Gatekeeper still quarantines a copy
          # downloaded through a browser — the install script uses curl,
          # which does not set the quarantine flag.
          codesign --force --sign - iql
          codesign --verify --verbose iql

      - name: Build
        if: matrix.goarch != 'universal'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          go build -trimpath -tags sqlite_fts5 \
            -ldflags "-s -w -X github.com/user/inboxql/internal/cli.Version=${{ steps.version.outputs.value }}" \
            -o "${{ matrix.binary }}" ./cmd/iql

      - name: Verify the binary reports the tagged version
        shell: bash
        run: |
          built=$(./${{ matrix.binary }} --json version | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          expected="${{ steps.version.outputs.value }}"
          if [ "$built" != "$expected" ]; then
            echo "binary reports $built but the tag says $expected"
            exit 1
          fi
          echo "version $built"
          # Without the tag a binary cannot write to a mailbox a tagged one
          # indexed, and v0.0.101–v0.0.103 shipped that way.
          full=$(./${{ matrix.binary }} --json version | node -p "JSON.parse(require('fs').readFileSync(0)).fullText")
          if [ "$full" != "true" ]; then
            echo "binary was built without FTS5 (-tags sqlite_fts5)"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" readme.md AGENTS.md dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" ./*
          else
            tar czf "../${{ matrix.artifact }}.tar.gz" ./*
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # What changed, from the same entry Help shows; then how to install.
      - name: Release notes
        shell: bash
        run: |
          version="${{ needs.gate.outputs.version }}"
          awk -v v="$version" '
            /^## / { t=$0; sub(/^## /,"",t); sub(/ \{#.*$/,"",t); if (on) exit; on=(t==v); next }
            on { print }
          ' docs/release-notes.md > notes.md
          if [ ! -s notes.md ]; then
            echo "docs/release-notes.md has no entry for $version" >&2
            exit 1
          fi
          cat >> notes.md <<'INSTALL'

          ## Install

          **macOS and Linux**

          ```
          curl -fsSL https://techmuch.github.io/InboxQL/install.sh | sh
          ```

          **Windows** (PowerShell)

          ```
          irm https://techmuch.github.io/InboxQL/install.ps1 | iex
          ```

          The script verifies the download against `SHA256SUMS`, installs to
          `~/.iql/bin`, writes `~/.iql/settings.json`, and installs the login
          service. Already installed? `iql update`.

          Full instructions: https://techmuch.github.io/InboxQL/

          macOS builds are ad-hoc signed, not notarised. The install script
          downloads with curl, which Gatekeeper does not quarantine; a browser
          download needs `xattr -d com.apple.quarantine iql`.
          INSTALL
          cat notes.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: iql-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.gate.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          body_path: notes.md
